name: Compilación Automatizada para iOS (macOS Cloud)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar App Flutter para iOS
    runs-on: macos-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar plantilla limpia de iOS nativo Xcode
        run: |
          cd mobile
          rm -rf ios
          flutter create --platforms=ios --org com.puertomontt .

      - name: Configurar Info.plist con permisos de GPS y llamadas
        run: |
          cat << 'EOF' > mobile/ios/Runner/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>$(DEVELOPMENT_LANGUAGE)</string>
          	<key>CFBundleDisplayName</key>
          	<string>Puerto Montt Alerta Urbano</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>puertomontt_app</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>$(FLUTTER_BUILD_NAME)</string>
          	<key>CFBundleSignature</key>
          	<string>????</string>
          	<key>CFBundleVersion</key>
          	<string>$(FLUTTER_BUILD_NUMBER)</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UILaunchStoryboardName</key>
          	<string>LaunchScreen</string>
          	<key>UIMainStoryboardFile</key>
          	<string>Main</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          	<key>CADisableMinimumFrameDurationOnPhone</key>
          	<true/>
          	<key>UIApplicationSupportsIndirectInputEvents</key>
          	<true/>
          	<key>NSLocationWhenInUseUsageDescription</key>
          	<string>Puerto Montt Alerta Urbano requiere acceso a tu ubicación para mostrar tu posición en el mapa y permitirte reportar incidentes urbanos cercanos.</string>
          	<key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
          	<string>Puerto Montt Alerta Urbano requiere acceso a tu ubicación para notificar alertas de emergencia en tu zona.</string>
          	<key>LSApplicationQueriesSchemes</key>
          	<array>
          		<string>tel</string>
          		<string>https</string>
          		<string>http</string>
          	</array>
          	<key>NSAppTransportSecurity</key>
          	<dict>
          		<key>NSAllowsArbitraryLoads</key>
          		<true/>
          	</dict>
          </dict>
          </plist>
          EOF

      - name: Generar configuración e instalar CocoaPods
        run: |
          cd mobile
          flutter pub get
          flutter build ios --config-only
          cd ios
          pod install
          cd ..

      - name: Compilar iOS (No-Sign / Prueba)
        run: |
          cd mobile
          flutter build ios --release --no-codesign

      - name: Subir artefacto de compilación de iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: mobile/build/ios/iphoneos/Runner.app
