name: Compilación Automatizada para iOS (macOS Cloud)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar App Flutter para iOS
    runs-on: macos-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd mobile
          flutter pub get

      - name: Compilar iOS (No-Sign / Prueba)
        run: |
          cd mobile
          flutter build ios --release --no-codesign

      - name: Subir artefacto de compilación de iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: mobile/build/ios/iphoneos/Runner.app
